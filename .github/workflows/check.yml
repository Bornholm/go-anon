name: check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: 0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: 0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./...

  # Le détecteur de courses exige CGO ; les jobs ci-dessus restent en CGO_ENABLED=0
  # pour valider la compilation Go pur.
  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test (race detector)
        run: go test -race ./...

  # Les cibles de fuzz vérifient les invariants de sécurité (UTF-8, absence de
  # forme de surface résiduelle, secrets hors mapping, déterminisme de
  # Deanonymize). Le corpus de testdata/ est rejoué par le job `test` ; ce job
  # cherche activement de nouvelles entrées.
  fuzz:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    strategy:
      matrix:
        target:
          [
            FuzzAnonymizeInvariants,
            FuzzRoundTrip,
            FuzzDeanonymize,
            FuzzVerify,
          ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Fuzz ${{ matrix.target }}
        run: go test ./pkg/anonymizer/ -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 120s

      # Une entrée fautive est écrite dans testdata/ : la publier permet de
      # l'ajouter au corpus de non-régression sans la reproduire à la main.
      - name: Publier le contre-exemple
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: pkg/anonymizer/testdata/fuzz/
          if-no-files-found: ignore

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Informatif tant que les chantiers S5 (permissions du MappingStore) et S7
      # (timeouts HTTP, limite de corps, traversée de chemin dans cmd/server) ne
      # sont pas livrés : ces chantiers ferment l'essentiel des constats
      # MEDIUM/HIGH actuels. À passer bloquant à la fin de S7.
      - name: gosec
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium ./...
